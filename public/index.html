<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAMYAZA-MD // Secure Link</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:24px;background:#02070c;color:#f4f7f9}canvas{position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% 110%,#063f4d,#02070c 52%)}#grid{position:fixed;inset:0;z-index:-2;opacity:.22;background-image:linear-gradient(#27e6ff18 1px,transparent 1px),linear-gradient(90deg,#27e6ff18 1px,transparent 1px);background-size:44px 44px;transform:perspective(520px) rotateX(62deg) scale(1.8) translateY(32%);animation:grid 8s linear infinite}@keyframes grid{to{background-position:0 44px,44px 0}}.sat{position:fixed;width:5px;height:5px;border-radius:50%;background:#b7fff0;box-shadow:0 0 12px 4px #36f2bd;z-index:-1}.s1{top:18%;left:-10%;animation:orbit 18s linear infinite}.s2{top:58%;left:-10%;animation:orbit 27s linear infinite 4s}@keyframes orbit{to{left:110%;top:42%}}main{width:min(94vw,600px);padding:32px;border:1px solid #5df3d044;border-radius:26px;background:#071219ee;box-shadow:0 28px 100px #000b,0 0 70px #00d7ff16,inset 0 1px #ffffff20;backdrop-filter:blur(18px)}h1{margin:0;color:#a5ffe5;font-size:clamp(30px,8vw,52px);letter-spacing:.08em;text-shadow:0 0 24px #42ffd466}h1 span{color:#50dfff}p{color:#b8c9d0;line-height:1.5}.telemetry{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;color:#71f9d0;font:11px monospace}.telemetry span{padding:7px 9px;border:1px solid #57eecb33;border-radius:7px;background:#0b302b88}.tabs{display:flex;gap:10px;margin:24px 0 16px}button{cursor:pointer;border:0;border-radius:10px;padding:13px 17px;font-weight:800;background:linear-gradient(135deg,#4dff9a,#1bbddd);color:#041319}button.secondary{background:#ffffff0d;color:#e7ffff;border:1px solid #ffffff2b}.panel{padding:20px;border:1px solid #ffffff20;border-radius:16px;background:#031018b8}.hidden{display:none}input{width:100%;padding:14px;border:1px solid #ffffff30;border-radius:10px;background:#020b11;color:#fff;font-size:16px}.code{text-align:center;color:#62ffd4;font:700 29px monospace;letter-spacing:4px}.status{margin-top:18px;padding:12px;border-radius:10px;background:#ffffff0c;color:#c7e6e4;font:13px monospace}@media(max-width:480px){main{padding:24px 18px}.tabs{flex-direction:column}button{width:100%}}
  </style>
</head>
<body><canvas id="space"></canvas><div id="grid"></div><i class="sat s1"></i><i class="sat s2"></i><main>
  <h1>SAMYAZA<span>-MD</span></h1>
  <p>Establish a secure WhatsApp link through the orbital pairing network.</p>
  <div class="telemetry"><span>● LINK: READY</span><span>◉ ENCRYPTION: ON</span><span>◌ NODES: ONLINE</span></div>
  <div class="tabs"><button id="qrTab">QR code</button><button id="pairTab" class="secondary">Pairing code</button></div>
  <section id="qrPanel" class="panel"><div id="qrMessage">Waiting for a QR code…</div><img id="qr" class="hidden" alt="WhatsApp QR code" style="display:block;width:min(100%,320px);margin:18px auto;padding:8px;background:#fff;border-radius:14px"></section>
  <section id="pairPanel" class="panel hidden"><form id="pairForm"><label for="phone">Phone number with country code</label><p>Example: +254700000000</p><input id="phone" required minlength="7" maxlength="16" placeholder="+254700000000"><br><br><button>Get pairing code</button></form><div id="code" class="code"></div><p id="pairMessage"></p></section>
  <div id="status" class="status">Connecting to bot core…</div>
</main>
<script>
const q=s=>document.querySelector(s),qp=q('#qrPanel'),pp=q('#pairPanel');function tab(pair){qp.classList.toggle('hidden',pair);pp.classList.toggle('hidden',!pair);q('#qrTab').classList.toggle('secondary',pair);q('#pairTab').classList.toggle('secondary',!pair)}q('#qrTab').onclick=()=>tab(false);q('#pairTab').onclick=()=>tab(true);
async function refresh(){try{const s=await(await fetch('/api/status')).json();q('#status').textContent=s.message||s.status;const img=q('#qr');if(s.qrAvailable){img.src='/api/qr?v='+s.qrVersion;img.classList.remove('hidden');q('#qrMessage').textContent='Scan this signal with WhatsApp.'}else{img.classList.add('hidden');q('#qrMessage').textContent=s.status==='connected'?'WhatsApp is already connected.':'Waiting for a QR code…'}if(s.pairingCode)q('#code').textContent=s.pairingCode}catch{q('#status').textContent='Bot backend is unavailable.'}}
q('#pairForm').onsubmit=async e=>{e.preventDefault();q('#pairMessage').textContent='Requesting secure code…';try{const r=await fetch('/api/pairing',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({phone:q('#phone').value})});const d=await r.json();q('#pairMessage').textContent=d.message||'Could not generate a code.';if(d.code)q('#code').textContent=d.code}catch{q('#pairMessage').textContent='Could not reach the bot backend.'}};refresh();setInterval(refresh,2000);
const c=q('#space'),x=c.getContext('2d');let stars=[];function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:Math.min(150,Math.floor(innerWidth/7))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.2,v:Math.random()*.24+.04}))}function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){s.y-=s.v;if(s.y<0){s.y=innerHeight;s.x=Math.random()*innerWidth}x.beginPath();x.fillStyle='rgba(119,245,255,.7)';x.shadowBlur=8;x.shadowColor='#35eaff';x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill()}x.shadowBlur=0;requestAnimationFrame(draw)}resize();addEventListener('resize',resize);requestAnimationFrame(draw);
</script></body></html>
