<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="SAMYAZA-MD installation and pairing flowchart">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b5f54"/>
      <stop offset="100%" stop-color="#073f37"/>
    </linearGradient>
    <linearGradient id="boxAlt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11795f"/>
      <stop offset="100%" stop-color="#0a5145"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 z" fill="#25d366"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#0b1613"/>
  <text x="60" y="52" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#25d366">Installation &#38; First-Run Flow</text>
  <text x="60" y="80" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#8fbca8">From a clean machine to a linked, running bot</text>

  <!-- Column 1 -->
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect x="60" y="110" width="500" height="120" rx="14" fill="url(#box)" stroke="#25d366" stroke-width="1.5"/>
    <circle cx="105" cy="150" r="20" fill="#25d366"/>
    <text x="105" y="158" font-size="20" font-weight="800" fill="#04211a" text-anchor="middle">1</text>
    <text x="145" y="157" font-size="21" font-weight="700" fill="#ffffff">Clone the repository</text>
    <text x="90" y="190" font-size="15" fill="#bfe6d2">git clone https://github.com/samyazajnr28-sketch/</text>
    <text x="90" y="212" font-size="15" fill="#bfe6d2">SAMYAZA-MD.git &#38;&amp; cd SAMYAZA-MD</text>

    <rect x="60" y="270" width="500" height="120" rx="14" fill="url(#box)" stroke="#25d366" stroke-width="1.5"/>
    <circle cx="105" cy="310" r="20" fill="#25d366"/>
    <text x="105" y="318" font-size="20" font-weight="800" fill="#04211a" text-anchor="middle">2</text>
    <text x="145" y="317" font-size="21" font-weight="700" fill="#ffffff">Install dependencies</text>
    <text x="90" y="350" font-size="15" fill="#bfe6d2">npm install</text>
    <text x="90" y="372" font-size="15" fill="#bfe6d2">Install FFmpeg separately (audio + GIF features)</text>

    <rect x="60" y="430" width="500" height="120" rx="14" fill="url(#boxAlt)" stroke="#8ff0b4" stroke-width="1.5"/>
    <circle cx="105" cy="470" r="20" fill="#8ff0b4"/>
    <text x="105" y="478" font-size="20" font-weight="800" fill="#04211a" text-anchor="middle">3</text>
    <text x="145" y="477" font-size="21" font-weight="700" fill="#ffffff">Configure the bot</text>
    <text x="90" y="510" font-size="15" fill="#bfe6d2">Edit config.js (owner, prefix, mode, timezone)</text>
    <text x="90" y="532" font-size="15" fill="#bfe6d2">Create .env (GEMINI_API_KEY and optional DB URLs)</text>
  </g>

  <!-- Column 2 -->
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect x="640" y="110" width="500" height="120" rx="14" fill="url(#boxAlt)" stroke="#8ff0b4" stroke-width="1.5"/>
    <circle cx="685" cy="150" r="20" fill="#8ff0b4"/>
    <text x="685" y="158" font-size="20" font-weight="800" fill="#04211a" text-anchor="middle">4</text>
    <text x="725" y="157" font-size="21" font-weight="700" fill="#ffffff">Start the bot</text>
    <text x="670" y="190" font-size="15" fill="#bfe6d2">npm start</text>
    <text x="670" y="212" font-size="15" fill="#bfe6d2">Runs server.js and prints the QR / pairing menu</text>

    <rect x="640" y="270" width="500" height="120" rx="14" fill="url(#box)" stroke="#25d366" stroke-width="1.5"/>
    <circle cx="685" cy="310" r="20" fill="#25d366"/>
    <text x="685" y="318" font-size="20" font-weight="800" fill="#04211a" text-anchor="middle">5</text>
    <text x="725" y="317" font-size="21" font-weight="700" fill="#ffffff">Link WhatsApp</text>
    <text x="670" y="350" font-size="15" fill="#bfe6d2">Option A: scan the QR in the terminal</text>
    <text x="670" y="372" font-size="15" fill="#bfe6d2">Option B: choose 2 and enter your phone number</text>

    <rect x="640" y="430" width="500" height="120" rx="14" fill="url(#box)" stroke="#25d366" stroke-width="1.5"/>
    <circle cx="685" cy="470" r="20" fill="#25d366"/>
    <text x="685" y="478" font-size="20" font-weight="800" fill="#04211a" text-anchor="middle">6</text>
    <text x="725" y="477" font-size="21" font-weight="700" fill="#ffffff">Bot is online</text>
    <text x="670" y="510" font-size="15" fill="#bfe6d2">Send .menu to list every command</text>
    <text x="670" y="532" font-size="15" fill="#bfe6d2">Send .help &lt;command&gt; for usage details</text>
  </g>

  <!-- Arrows -->
  <g stroke="#25d366" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M310 230 L310 262"/>
    <path d="M310 390 L310 422"/>
    <path d="M560 490 C600 490 600 170 640 170"/>
    <path d="M890 230 L890 262"/>
    <path d="M890 390 L890 422"/>
  </g>
</svg>
